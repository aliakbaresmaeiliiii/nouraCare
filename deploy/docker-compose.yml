services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BASE_URL: ${BASE_URL}
      # sms.ir — required for phone OTP login (email OTP does not use these)
      SMS_IR_API_KEY: ${SMS_IR_API_KEY}
      SMS_IR_LINE_NUMBER: ${SMS_IR_LINE_NUMBER}
      SMS_IR_VERIFY_TEMPLATE_ID: ${SMS_IR_VERIFY_TEMPLATE_ID:-0}
      SMS_IR_VERIFY_PARAM_NAME: ${SMS_IR_VERIFY_PARAM_NAME:-OTP}
      SMS_OTP_SKIP_EMAIL: ${SMS_OTP_SKIP_EMAIL:-true}
      SMS_STRICT: ${SMS_STRICT:-true}
    volumes:
      - uploads_data:/app/server/public/uploads

volumes:
  mysql_data:
  uploads_data:
