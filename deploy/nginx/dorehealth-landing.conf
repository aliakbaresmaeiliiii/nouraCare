# Static marketing site for dorehealth.ir (like Angular dist — no Node/PM2).
#
# On your PC:
#   cd landing && npm run build:deploy
# Upload landing/deploy-out/* to /home/dorehealth/landing
#
# Keep the Ionic app at app.dorehealth.ir (separate nginx file).

server {
    listen 80;
    listen [::]:80;
    server_name dorehealth.ir www.dorehealth.ir;
    return 301 https://dorehealth.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dorehealth.ir;

    ssl_certificate     /etc/letsencrypt/live/dorehealth.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorehealth.ir/privkey.pem;

    return 301 https://dorehealth.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dorehealth.ir;

    ssl_certificate     /etc/letsencrypt/live/dorehealth.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorehealth.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/dorehealth/landing;
    index index.html;

    # Default locale
    location = / {
        return 302 /fa/;
    }

    location / {
        try_files $uri $uri/ $uri.html /fa/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|webp|avif)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
