# Angular/Ionic PWA — serve `client/dist/app` after `npm run build:pwa`.
#
# Install:
#   sudo mkdir -p /var/www/dorehealth-app
#   sudo rsync -a --delete client/dist/app/ /var/www/dorehealth-app/
#   sudo cp deploy/nginx/dorehealth-app.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/dorehealth-app.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d dorehealth.app -d www.dorehealth.app
#   sudo nginx -t && sudo systemctl reload nginx

map $sent_http_content_type $dorehealth_asset_cache {
    default                    "public, max-age=31536000, immutable";
    "text/html"                "no-cache, no-store, must-revalidate";
    "application/json"         "no-cache";
    "application/manifest+json" "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name dorehealth.app www.dorehealth.app;
    return 301 https://dorehealth.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.dorehealth.app;

    ssl_certificate     /etc/letsencrypt/live/dorehealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorehealth.app/privkey.pem;

    return 301 https://dorehealth.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dorehealth.app;

    ssl_certificate     /etc/letsencrypt/live/dorehealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dorehealth.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/dorehealth-app;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Serve real files first; only unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $dorehealth_asset_cache;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(ngsw-worker|safety-worker|worker-basic\.min)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }
}
