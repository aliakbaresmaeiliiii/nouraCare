# Upstream NestJS API
upstream dorehealth_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.dorehealth.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dorehealth.app;

    # certbot fills these paths:
    ssl_certificate     /etc/letsencrypt/live/api.dorehealth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dorehealth.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    location / {
        proxy_pass http://dorehealth_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://dorehealth_api;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
