<div
  class="app-logo-loading"
  [class.app-logo-loading--embedded]="layout() === 'embedded'"
  role="status"
  [attr.aria-label]="ariaLabel()"
  aria-live="polite"
>
  <img
    src="assets/branding/logo.png"
    alt=""
    class="app-logo-loading__mark"
    width="64"
    height="64"
    decoding="async"
    aria-hidden="true"
  />
  @if (message(); as text) {
    <p class="app-logo-loading__msg">{{ text }}</p>
  }
</div>
