<div
  class="app-logo-loading"
  [class.app-logo-loading--embedded]="layout() === 'embedded'"
  role="status"
  [attr.aria-label]="ariaLabel()"
  aria-live="polite"
>
  <ion-spinner name="crescent"></ion-spinner>
  @if (message(); as text) {
    <p class="app-logo-loading__msg">{{ text }}</p>
  }
</div>
