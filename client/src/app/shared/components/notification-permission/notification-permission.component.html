<div class="notification-permission-container">
  <!-- Simple Header -->
  <div class="permission-header">
    <div class="header-icon">🔔</div>
    <h2 class="header-title">Enable Notifications?</h2>
    <p class="header-subtitle">Get helpful reminders and health updates</p>
  </div>

  <!-- Simple Toggle -->
  <div class="toggle-section">
    <ion-item lines="none" class="toggle-item">
      <ion-label>Receive notifications</ion-label>
      <ion-toggle 
        [(ngModel)]="enableNotifications"
        (ionChange)="onToggleChange()">
      </ion-toggle>
    </ion-item>
  </div>

  <!-- Simple Action -->
  <div class="action-section">
    <ion-button 
      expand="block" 
      size="large"
      (click)="savePreference()"
      class="permission-button">
      Continue
    </ion-button>
  </div>
</div>
