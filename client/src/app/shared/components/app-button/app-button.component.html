<ion-button
  [type]="type()"
  [expand]="expand()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <ion-spinner name="crescent" slot="start" aria-hidden="true"></ion-spinner>
  }
  <ng-content></ng-content>
</ion-button>
