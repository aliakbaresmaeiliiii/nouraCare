<ion-button
  class="app-button"
  [class.app-button--loading]="loading()"
  shape="round"
  [type]="type()"
  [expand]="expand()"
  [size]="size()"
  [disabled]="disabled() || loading()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onClick($event)"
>
  <span class="app-button__label" [class.app-button__label--loading]="loading()">
    @if (loading()) {
      <ion-spinner
        class="app-button__spinner"
        name="crescent"
        aria-hidden="true"
      ></ion-spinner>
    }
    <ng-content></ng-content>
  </span>
</ion-button>
