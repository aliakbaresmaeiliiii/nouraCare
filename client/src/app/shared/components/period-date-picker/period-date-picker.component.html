<div class="period-date-picker">
  <!-- Calendar Header -->
  <div class="calendar-header">
    <ion-button fill="clear" size="small" class="nav-button" (click)="previousMonth()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </ion-button>
    <div class="month-year">
      <h3 class="month-name">{{ monthName() }}</h3>
      <p class="year-name">{{ yearName() }}</p>
    </div>
    <ion-button fill="clear" size="small" class="nav-button" (click)="nextMonth()">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </ion-button>
  </div>

  <!-- Week Days Header -->
  <div class="weekdays-header">
    @for (day of weekDays(); track day) {
    <div class="weekday">{{ day }}</div>
    }
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid">
    @for (day of calendarDays(); track day.getTime()) {
    <div class="calendar-day-wrapper">
      <div 
        class="calendar-day" 
        [class]="getDateClasses(day)"
        (click)="onDateSelect(day)"
        [class.clickable]="isCurrentMonth(day)">
        <span class="day-number">{{ day.getDate() }}</span>
        <div class="period-indicator" [class]="getPeriodIndicatorClass(day)"></div>
      </div>
    </div>
    }
  </div>

  <!-- Legend -->
  <div class="calendar-legend">
    <div class="legend-item">
      <div class="legend-indicator past-start"></div>
      <span>Past Period</span>
    </div>
    <div class="legend-item">
      <div class="legend-indicator upcoming-period"></div>
      <span>Upcoming Period</span>
    </div>
    <div class="legend-item">
      <div class="legend-indicator future-start"></div>
      <span>Selected Date</span>
    </div>
  </div>
</div>
