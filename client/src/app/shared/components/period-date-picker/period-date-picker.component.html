<div class="period-date-picker">
  <nav
    class="pdp-month-bar"
    [attr.aria-label]="'cycleCalendar.a11y.monthNav' | translate"
  >
    <button
      type="button"
      class="pdp-nav-btn"
      (click)="previousMonth()"
      [attr.aria-label]="'cycleCalendar.a11y.prevMonth' | translate"
    >
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <h2 class="pdp-month-title">{{ monthYearTitle() }}</h2>
    <button
      type="button"
      class="pdp-nav-btn"
      (click)="nextMonth()"
      [attr.aria-label]="'cycleCalendar.a11y.nextMonth' | translate"
    >
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>
  </nav>

  <div class="pdp-legend" role="list">
    <button
      type="button"
      class="pdp-legend-pill pdp-legend-pill--start"
      [class.pdp-legend-pill--active]="isLegendActive('start')"
      role="listitem"
      (click)="focusLegend('start')"
      [attr.aria-label]="'periodDatePicker.a11y.highlightFirstDay' | translate"
    >
      <span class="pdp-legend-dot pdp-legend-dot--start"></span>
      {{ 'periodDatePicker.legend.firstDay' | translate }}
    </button>
    <button
      type="button"
      class="pdp-legend-pill pdp-legend-pill--period"
      [class.pdp-legend-pill--active]="isLegendActive('period')"
      role="listitem"
      (click)="focusLegend('period')"
      [attr.aria-label]="'periodDatePicker.a11y.highlightPeriodDays' | translate"
    >
      <span class="pdp-legend-dot pdp-legend-dot--period"></span>
      {{ 'periodDatePicker.legend.period' | translate }}
    </button>
    <span class="pdp-legend-pill pdp-legend-pill--cycle" role="listitem">
      <span class="pdp-legend-dot pdp-legend-dot--cycle"></span>
      {{ 'periodDatePicker.legend.cycle' | translate }}
    </span>
    <button
      type="button"
      class="pdp-legend-pill pdp-legend-pill--today"
      [class.pdp-legend-pill--active]="isLegendActive('today')"
      role="listitem"
      (click)="focusLegend('today')"
      [attr.aria-label]="'periodDatePicker.a11y.highlightToday' | translate"
    >
      <span class="pdp-legend-dot pdp-legend-dot--today"></span>
      {{ 'periodDatePicker.legend.today' | translate }}
    </button>
  </div>

  <div class="pdp-calendar-card">
    <div class="pdp-dow-row" aria-hidden="true">
      @for (day of weekDays(); track day) {
        <span class="pdp-dow">{{ day }}</span>
      }
    </div>

    <div class="pdp-grid">
      @for (day of calendarDays(); track day.getTime()) {
        <div class="pdp-cell-wrap">
          <button
            type="button"
            class="pdp-cell"
            [class.pdp-cell--other]="!isCurrentMonth(day)"
            [class.pdp-cell--today]="isToday(day)"
            [class.pdp-cell--start]="isSelectedStartDate(day)"
            [class.pdp-cell--cycle]="isInCycleRange(day) && !isInPeriodRange(day) && !isSelectedStartDate(day)"
            [class.pdp-cell--period]="isInPeriodRange(day) && !isSelectedStartDate(day)"
            [class.pdp-cell--focus-start]="isLegendActive('start') && isSelectedStartDate(day)"
            [class.pdp-cell--focus-period]="isLegendActive('period') && isInPeriodRange(day)"
            [class.pdp-cell--focus-today]="isLegendActive('today') && isToday(day)"
            [disabled]="!isCurrentMonth(day)"
            (click)="onDateSelect(day)"
          >
            <span class="pdp-day-num">{{ displayDayNum(day) | localNum }}</span>
          </button>
        </div>
      }
    </div>
  </div>
</div>
