<ion-content class="tpi-content" [fullscreen]="true" scrollY="false">
  <div class="tpi-root">
    <header class="tpi-top">
      <ion-button
        type="button"
        fill="clear"
        class="tpi-close"
        (click)="close()"
        [attr.aria-label]="'trackPregnancyIntro.closeAria' | translate"
      >
        <ion-icon name="close" slot="icon-only" aria-hidden="true"></ion-icon>
      </ion-button>
    </header>

    <main class="tpi-main">
      <div class="tpi-figure" aria-hidden="true">
        <div class="tpi-figure-ring">
          <img class="tpi-hero-img" [src]="heroImageSrc" alt="" />
        </div>
      </div>

      <h1 class="tpi-title">{{ 'trackPregnancyIntro.title' | translate }}</h1>
      <p class="tpi-body">{{ 'trackPregnancyIntro.body' | translate }}</p>
    </main>

    <footer class="tpi-footer">
      <ion-button class="tpi-next" shape="round" (click)="continueNext()">
        {{ 'trackPregnancyIntro.next' | translate }}
      </ion-button>
    </footer>
  </div>
</ion-content>
