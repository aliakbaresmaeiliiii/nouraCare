<ion-content class="tpi2-content" [fullscreen]="true" scrollY="false">
  <div class="tpi2-root">
    <img
      class="tpi-logo"
      src="assets/branding/AppIcon-welcome.png"
      alt=""
      aria-hidden="true"
    />
    <header class="tpi2-top">
      <ion-progress-bar [value]="progressValue"></ion-progress-bar>
      <button type="button" class="tpi2-skip" (click)="onSkip()">
        {{ "common.skip" | translate }}
      </button>
    </header>

    <main class="tpi2-main">
      <h1 class="tpi2-title">{{ "tpi.step2.title" | translate }}</h1>

      <div class="tpi2-options">
        @for (option of options; track option) {
          <button type="button" class="tpi2-option" (click)="onSelect(option)">
            {{ "tpi.step2.option." + option | translate }}
          </button>
        }
      </div>
    </main>
  </div>
</ion-content>
