<ion-content class="tpi2-content" [fullscreen]="true" scrollY="false">
  <div class="tpi2-root">
    <header class="tpi2-top">
      <div
        class="tpi2-progress"
        role="progressbar"
        aria-label="Pregnancy onboarding progress"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="progress"
      >
        <div class="tpi2-progress-fill" [style.width.%]="progress"></div>
      </div>
      <button type="button" class="tpi2-skip" (click)="onSkip()">Skip</button>
    </header>

    <main class="tpi2-main">
      <h1 class="tpi2-title">How are you feeling?</h1>

      <div class="tpi2-options">
        @for (option of options; track option) {
          <button type="button" class="tpi2-option" (click)="onSelect()">{{ option }}</button>
        }
      </div>
    </main>
  </div>
</ion-content>
