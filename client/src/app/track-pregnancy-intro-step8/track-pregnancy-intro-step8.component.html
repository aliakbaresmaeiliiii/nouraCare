<ion-content class="tpi8-content" [fullscreen]="true" scrollY="false">
  <div class="tpi8-root">
    <header class="tpi8-top">
      <button type="button" class="tpi8-skip" (click)="onSkip()">Skip</button>
    </header>

    <main class="tpi8-main">
      <h1 class="tpi8-title">Have you had a prepregnancy checkup?</h1>
      <p class="tpi8-body">
        This is when a health care professional makes sure you're healthy and ready for pregnancy.
      </p>

      <div class="tpi8-options">
        @for (option of options; track option) {
          <button type="button" class="tpi8-option" (click)="onSelect()">{{ option }}</button>
        }
      </div>
    </main>
  </div>
</ion-content>
