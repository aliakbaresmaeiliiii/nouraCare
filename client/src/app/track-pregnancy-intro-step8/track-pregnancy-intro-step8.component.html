<ion-content class="tpi8-content" [fullscreen]="true" scrollY="false">
  <div class="tpi8-root">
    <img class="tpi-logo" src="assets/branding/AppIcon-welcome.png" alt="" aria-hidden="true" />
    <header class="tpi8-top">
      <ion-progress-bar [value]="progressValue"></ion-progress-bar>
      <button type="button" class="tpi8-skip" (click)="onSkip()">{{ 'common.skip' | translate }}</button>
    </header>

    <main class="tpi8-main">
      <h1 class="tpi8-title">{{ 'tpi.step8.title' | translate }}</h1>
      <p class="tpi8-body">
        {{ 'tpi.step8.body' | translate }}
      </p>

      <div class="tpi8-options">
        @for (option of options; track option) {
          <button type="button" class="tpi8-option" (click)="onSelect(option)">
            {{ ('tpi.step8.option.' + option) | translate }}
          </button>
        }
      </div>
    </main>
  </div>
</ion-content>
