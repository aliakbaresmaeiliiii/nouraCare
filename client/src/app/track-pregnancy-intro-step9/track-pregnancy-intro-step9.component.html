<ion-content class="tpi9-content" [fullscreen]="true" scrollY="false">
  <div class="tpi9-root">
    <header class="tpi9-top">
      <ion-progress-bar [value]="progressValue"></ion-progress-bar>
      <button type="button" class="tpi9-skip" (click)="onSkip()">Skip</button>
    </header>

    <main class="tpi9-main">
      <h1 class="tpi9-title">Has your partner made any changes to prepare for trying to get pregnant?</h1>

      <div class="tpi9-options">
        @for (option of options; track option) {
          <button type="button" class="tpi9-option" (click)="onSelect()">{{ option }}</button>
        }
      </div>
    </main>
  </div>
</ion-content>
