<app-auth-layout>
  <div
    class="p-4 lg:w-1/3 border-2 rounded-2xl shadow-xl overflow-auto md:w-full max-h-[500px] bg-slate-50 absolute top-1/2 left-1/2 -translate-x-2/4 -translate-y-2/4"
  >
    <h3 class="font-extrabold text-center">Registration {{ title() }}</h3>
    <h2 class="cursor-pointer flex justify-center text-xs sign-up py-6">
      Enter details to create your account
    </h2>
    <h2 class="cursor-pointer flex justify-start text-xs pb-6">
      Already Registered?
      <a class="ml-2" routerLink="/auth/login"
        ><strong class="text-blue-600">Login</strong>
      </a>
    </h2>
 
    <form
      class="flex flex-col gap-2"
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
    >
      <!-- <mat-form-field appearance="outline" class="w-full">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="first_name" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>lastName</mat-label>
        <input matInput formControlName="last_name" />
      </mat-form-field> -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
     
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Phone</mat-label>
        <input matInput type="tel" formControlName="phone" />
      </mat-form-field>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="!form.valid"
      >
        Register
      </button>
    </form>
  </div>
</app-auth-layout>
