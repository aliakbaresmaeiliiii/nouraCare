<ion-content>
  <form [formGroup]="form">
    <div class="flex flex-col justify-center items-center h-full">
      <ion-input-otp
        type="text"
        class="custom"
        separators="all"
        formControlName="otpCode"
        (ionInput)="onOtpChange($event)"
      >
        {{ getValidationText("otpCode") }}
      </ion-input-otp>

      @if(!isExpired){
      <p>
        Code expires in:
        <strong>{{ timer }}s</strong>
      </p>
      }
      <p>
        Didn't get a code?
        <span (click)="resendCode()"  class="text-blue-500"
          >Resend the code</span
        >
      </p>
    </div>
  </form>
</ion-content>
<ion-toast
  [isOpen]="showToast"
  [message]="message"
  [duration]="3000"
  (didDismiss)="(showToast)"
  [buttons]="['OK']"
  [color]="success() ? 'success' : 'danger'"
>
</ion-toast>
