<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item class="pt-2">
    <ion-avatar>
      <img
        class="w-8 h-8"
        alt="Silhouette of a person's head"
        src="https://ionicframework.com/docs/img/demos/avatar.svg"
      />
    </ion-avatar>
    <div class="flex justify-between items-center w-full">
      <div class="flex flex-col">
        <span class="!text-md pl-1">Aliakbar Esmaeili</span>
        <span class="text-red-500 pl-1 text-[10px]"> 30% is completed </span>
      </div>
    </div>
  </ion-item>

  <ion-item class="mt-2" lines="none">
    @for (item of userInfo(); track $index) {
    <div
      class="grid grid-cols-4 w-full py-2 text-xs text-center bg-gray-200 text-gray-600 rounded-md"
    >
      <div class="flex flex-col gap-1.5">
        <span>{{ item.Question }}</span>
        <ion-label class="!text-[10px]">item.Question </ion-label>
      </div>
      <div class="flex flex-col gap-1.5">
        <span>{{ item.friends }}</span>
        <ion-label class="!text-[10px]">friends </ion-label>
      </div>
      <div class="flex flex-col gap-1.5">
        <span>{{ item.Answers }}</span>
        <ion-label class="!text-[10px]">item.Answers</ion-label>
      </div>
      <div class="flex flex-col gap-1.5">
        <span>{{ item.Benefits }}</span>
        <ion-label class="!text-[10px]">Benefits</ion-label>
      </div>
    </div>
    }
  </ion-item>

  <ion-item>
    <div class="grid grid-cols-8 gap-2 w-full">
      <div class="col-span-7 h-3">
        <ion-button fill="outline" class="w-full">Edit Profile</ion-button>
      </div>
      <div>
        <ion-button fill="outline" class="w-full">
          <ion-icon name="share-social-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-item>


  <!-- <div class="flex justify-between items-center">
    <ion-label>Present to complete Profile</ion-label> -->
  <!-- <div class="bg-red-600">asdf -->
      <app-circle-progress-bar [value]="percent"/>
  <!-- </div> -->
  <!-- </div> -->
</ion-content>
