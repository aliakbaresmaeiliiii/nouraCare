<ion-menu contentId="main-content" ngSkipHydration>
  <ion-header>
    <ion-toolbar>
      <ion-item lines="none">
        <div class="flex justify-between items-center">
          <div>
            <ion-title>
              <ion-item>
                <ion-avatar slot="start">
                  <img
                    class="w-8 h-8"
                    alt="Silhouette of a person's head"
                    src="https://ionicframework.com/docs/img/demos/avatar.svg"
                  />
                </ion-avatar>
                <div class="flex flex-col">
                  <span class="!text-md">Aliakbar Esmaeili</span>
                  <span class="text-red-500 text-[10px]">
                    30% is completed
                  </span>
                </div>
              </ion-item>
            </ion-title>
          </div>
          <div>
            <ion-title
              class="text-sm font-normal pr-2 text-cyan-500"
              slot="end"
            >
              Profile &gt;
            </ion-title>
          </div>
        </div>
      </ion-item>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="flex flex-col text-xs gap-4 pt-2 w-full">
      @for (item of menuItemsTop; track $index) {
      <button
        class="flex items-center gap-1.5 transition-colors duration-200 h-7 !pl-4 "
        [ngClass]="{
          'bg-cyan-100 text-cyan-700 w-full': activeIndexTop === $index,
          'hover:bg-gray-100 text-gray-700': activeIndexTop !== $index
        }"
        (click)="setActiveTop($index)"
      >
        <ion-icon [name]="item.icon"></ion-icon>
        {{ item.label }}
      </button>
      }
    </div>

    <div class="bg-cyan-400 h-0.5 my-4"></div>

    <div class="flex flex-col text-xs gap-10">
      @for (item of menuItemsBottom; track $index) {
      <div class="flex items-center gap-1.5">
        <ion-icon [name]="item.icon"></ion-icon>
        {{ item.label }}
      </div>
      }
    </div>

    <div class="bg-cyan-400 h-0.5 mt-6"></div>

    <div class="flex items-center justify-center gap-3 mt-4">
      <img class="w-8" src="assets/images/instagram.png" alt="Instagram" />
      <img class="w-8" src="assets/images/telegram.png" alt="Telegram" />
    </div>
  </ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button icon="person-circle"></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding" id="main-content">
    <app-home />
  </ion-content>
</div>
