<ion-content class="tpi6-content" [fullscreen]="true" scrollY="false">
  <div class="tpi6-root">
    <div class="tpi6-ring-wrap" aria-hidden="true">
      <svg class="tpi6-ring" viewBox="0 0 280 280" role="img">
        <circle class="tpi6-track" cx="140" cy="140" r="120"></circle>
        <circle
          class="tpi6-fill"
          cx="140"
          cy="140"
          r="120"
          [attr.stroke-dashoffset]="dashOffset"
        ></circle>
      </svg>
      <div class="tpi6-value">{{ progress }} <span>%</span></div>

      @if (showFirstPregnancyDialog) {
        <div class="tpi6-dialog" role="dialog" aria-modal="true" aria-label="Pregnancy question">
          <div class="tpi6-dialog-title">Is this your first pregnancy?</div>
          <div class="tpi6-dialog-actions">
            <button type="button" class="tpi6-dialog-btn" (click)="onFirstPregnancyAnswer(false)">
              No
            </button>
            <button type="button" class="tpi6-dialog-btn" (click)="onFirstPregnancyAnswer(true)">
              Yes
            </button>
          </div>
        </div>
      }
    </div>

    <h1 class="tpi6-title">Creating your personal program...</h1>
  </div>
</ion-content>
