<ion-content class="tpi6-content" [fullscreen]="true" scrollY="false">
  <div class="tpi6-root">
    <div class="tpi6-loader-wrap" aria-hidden="true">
      <div
        class="tpi6-loader"
        [style.--progress]="progress + '%'"
        role="img"
        aria-label="Personalization progress"
      >
        <span class="tpi6-percent">{{ progress }}<small>%</small></span>
      </div>
    </div>

    <h1 class="tpi6-title">Personalizing your experience ...</h1>
  </div>
</ion-content>
