<ion-content class="tpi11-content" [fullscreen]="true" scrollY="false">
  <div class="tpi11-root">
    <header class="tpi11-top">
      <button type="button" class="tpi11-skip" (click)="onSkip()">Skip</button>
    </header>

    <main class="tpi11-main">
      <h1 class="tpi11-title">Would you like to learn more about sex for pregnancy?</h1>
      <p class="tpi11-body">
        Our sex experts have created articles, videos, and guides to answer your most intimate
        questions.
      </p>

      <div class="tpi11-options">
        @for (option of options; track option) {
          <button
            type="button"
            class="tpi11-option"
            [class.tpi11-option--active]="selectedOption === option"
            (click)="onSelect(option)"
          >
            <span class="tpi11-option-text">{{ option }}</span>
            @if (selectedOption === option) {
              <span class="tpi11-option-check" aria-hidden="true">✓</span>
            } @else {
              <span class="tpi11-option-radio" aria-hidden="true"></span>
            }
          </button>
        }
      </div>
    </main>
  </div>
</ion-content>
