<ion-content class="tpi10-content" [fullscreen]="true" scrollY="false">
  <div class="tpi10-root">
    <header class="tpi10-top">
      <ion-progress-bar [value]="progressValue"></ion-progress-bar>
      <button type="button" class="tpi10-skip" (click)="onSkip()">Skip</button>
    </header>

    <main class="tpi10-main">
      <h1 class="tpi10-title">Do you feel you have a healthy diet?</h1>
      <p class="tpi10-body">
        What you eat is an important factor in being healthy and ready for pregnancy.
      </p>

      <div class="tpi10-options">
        @for (option of options; track option) {
          <button type="button" class="tpi10-option" (click)="onSelect()">{{ option }}</button>
        }
      </div>
    </main>
  </div>
</ion-content>
