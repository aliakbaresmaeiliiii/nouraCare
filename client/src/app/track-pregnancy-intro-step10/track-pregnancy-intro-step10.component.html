<ion-content class="tpi10-content" [fullscreen]="true" scrollY="false">
  <div class="tpi10-root">
    <img class="tpi-logo" src="assets/branding/AppIcon-welcome.png" alt="" aria-hidden="true" />
    <header class="tpi10-top">
      <ion-progress-bar [value]="progressValue"></ion-progress-bar>
      <button type="button" class="tpi10-skip" (click)="onSkip()">{{ 'common.skip' | translate }}</button>
    </header>

    <main class="tpi10-main">
      <h1 class="tpi10-title">{{ 'tpi.step10.title' | translate }}</h1>
      <p class="tpi10-body">
        {{ 'tpi.step10.body' | translate }}
      </p>

      <div class="tpi10-options">
        @for (option of options; track option) {
          <button type="button" class="tpi10-option" (click)="onSelect(option)">
            {{ ('tpi.step10.option.' + option) | translate }}
          </button>
        }
      </div>
    </main>
  </div>
</ion-content>
