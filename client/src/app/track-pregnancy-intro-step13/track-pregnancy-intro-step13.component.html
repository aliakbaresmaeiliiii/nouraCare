<ion-content class="tpi13-content" [fullscreen]="true" scrollY="false">
  <div class="tpi13-root">
    <main class="tpi13-main">
      <div class="tpi13-figure" aria-hidden="true">
        <div class="tpi13-figure-frame">
          <img class="tpi13-hero-img" [src]="heroImageSrc" alt="" />
        </div>
      </div>

      <h1 class="tpi13-title">Understand your fertility with Premium+</h1>

      <ul class="tpi13-points">
        <li class="tpi13-point">
          Advanced ovulation predictions and personalized conception tips
        </li>
        <li class="tpi13-point">
          Guidance on what could impact your chances from medical experts
        </li>
        <li class="tpi13-point">
          Tailored insights to help boost your chances of pregnancy
        </li>
      </ul>
    </main>

    <footer class="tpi13-footer">
      <ion-button class="tpi13-cta" shape="round" (click)="continueNext()"
        >Continue</ion-button
      >
    </footer>
  </div>
</ion-content>
