

<app-side-menu></app-side-menu>

<ion-header class="modern-header" [translucent]="false">
  <div class="app-container">
    <ion-toolbar class="header-toolbar">
      <ion-buttons slot="start" class="header-left">
        <ion-menu-button class="menu-button">
          <ion-icon name="menu-outline"></ion-icon>
        </ion-menu-button>
      </ion-buttons>

      <div slot="end" class="header-right">
        <ion-button
          fill="clear"
          class="header-action header-action--notifications"
          (click)="openNotifications()"
          [attr.aria-label]="notificationsAriaLabel"
        >
          <span class="notification-bell" aria-hidden="true">
            <ion-icon name="notifications-outline"></ion-icon>
            @if (unreadCount > 0) {
              <span class="notification-bell__badge">{{ unreadBadgeText }}</span>
            }
          </span>
        </ion-button>

        <app-header-language-switcher></app-header-language-switcher>

        <ion-button fill="clear" class="header-action" (click)="openProfile()">
          <div class="profile-avatar">
            <img
              src="assets/images/user-avatar.png"
              alt="Profile"
              onerror="this.style.display = 'none'"
            />
            @if (!hasUserAvatar) {
            <ion-icon name="person-circle-outline"></ion-icon>
            }
          </div>
        </ion-button>
      </div>
    </ion-toolbar>
  </div>
</ion-header>
<ion-tabs id="main-content">
  <!-- <ion-router-outlet></ion-router-outlet> -->
  <ion-tab-bar slot="bottom" class="app-tab-bar">
    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <span class="tab-label">{{ "nav.home" | translate }}</span>
    </ion-tab-button>
    <ion-tab-button tab="insights" href="/tabs/insights">
      <ion-icon name="bulb-outline"></ion-icon>
      <span class="tab-label">{{ "nav.insights" | translate }}</span>
    </ion-tab-button>
    <ion-tab-button tab="consultation" href="/tabs/consultation">
      <ion-icon name="calendar-outline"></ion-icon>
      <span class="tab-label">{{ "nav.consultation" | translate }}</span>
    </ion-tab-button>
    <ion-tab-button tab="school" href="/tabs/school">
      <ion-icon name="school-outline"></ion-icon>
      <span class="tab-label">{{ "nav.school" | translate }}</span>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
