<ion-app>
  <app-side-menu></app-side-menu>

  <!-- Main layout -->
  <div class="ion-page" id="main-content">
    <!-- Shared header -->
    <ion-header>
      <ion-toolbar>
        <ion-toggle
        class="mr-1"
        slot="end"
          [(ngModel)]="paletteToggle"
          (ionChange)="toggleChange($event)"
        ></ion-toggle>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>{{ selectedTitle }}</ion-title>
      </ion-toolbar>
    </ion-header>

    <!-- Tab content -->
    <ion-tabs>
      <!-- <ion-router-outlet></ion-router-outlet> -->
      
      <ion-tab-bar slot="bottom">
        <ion-tab-button tab="home" href="tabs/home">
          <ion-icon name="home"></ion-icon>
          Home
        </ion-tab-button>
        <ion-tab-button tab="tools" href="tabs/tools">
          <ion-icon name="construct"></ion-icon>
          Tools
        </ion-tab-button>
        <ion-tab-button tab="social" href="tabs/social">
          <ion-icon name="people"></ion-icon>
          Social
        </ion-tab-button>
        <ion-tab-button tab="consultation" href="tabs/consultation">
          <ion-icon name="calendar"></ion-icon>
          Consultation
        </ion-tab-button>
        <ion-tab-button tab="school" href="tabs/school">
          <ion-icon name="school"></ion-icon>
          School
        </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </div>
</ion-app>
