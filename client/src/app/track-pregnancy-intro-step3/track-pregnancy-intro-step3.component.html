<ion-content class="tpi3-content" [fullscreen]="true" scrollY="false">
  <div class="tpi3-root">
    <ion-progress-bar [value]="progressValue"></ion-progress-bar>
    <main class="tpi3-main">
      <div class="tpi3-figure" aria-hidden="true">
        <div class="tpi3-figure-ring">
          <img class="tpi3-hero-img" [src]="heroImageSrc" alt="" />
        </div>
      </div>

      <h1 class="tpi3-title">
        Based on your cycle data, you are
        <span class="tpi3-title-accent">1 week 3 days</span>
        pregnant
      </h1>
      <p class="tpi3-body">
        We use the number of completed weeks since the first day of your last period to calculate
        pregnancy.
      </p>
    </main>

    <footer class="tpi3-footer">
      <ion-button class="tpi3-cta" shape="round" (click)="continueNext()">
        Continue
      </ion-button>
    </footer>
  </div>
</ion-content>
