<section id="faq" class="faq" aria-labelledby="faq-title">
  <div class="faq__inner">
    <header class="faq__header">
      <p class="faq__eyebrow">{{ 'landing.faq.eyebrow' | translate }}</p>
      <h2 id="faq-title">{{ 'landing.faq.title' | translate }}</h2>
    </header>

    <div class="faq__list">
      @for (n of faqKeys; track n; let i = $index) {
        <div class="faq__item" [class.faq__item--open]="openIndex() === i">
          <button
            type="button"
            class="faq__trigger"
            (click)="toggle(i)"
            [attr.aria-expanded]="openIndex() === i"
          >
            <span>{{ qKey(n) | translate }}</span>
            <span class="faq__icon" aria-hidden="true"></span>
          </button>
          @if (openIndex() === i) {
            <p class="faq__answer">{{ aKey(n) | translate }}</p>
          }
        </div>
      }
    </div>
  </div>
</section>
