<section id="features" class="features" aria-labelledby="features-title">
  <div class="features__inner">
    <header class="features__header">
      <p class="features__eyebrow">{{ 'landing.features.eyebrow' | translate }}</p>
      <h2 id="features-title">{{ 'landing.features.title' | translate }}</h2>
      <p class="features__lede">{{ 'landing.features.lede' | translate }}</p>
    </header>

    <ul class="features__grid">
      @for (n of featureKeys; track n; let i = $index) {
        <li class="features__item" [style.--delay]="i * 70 + 'ms'">
          <span class="features__index" aria-hidden="true">{{ pad(n) }}</span>
          <h3>{{ titleKey(n) | translate }}</h3>
          <p>{{ bodyKey(n) | translate }}</p>
        </li>
      }
    </ul>
  </div>
</section>
