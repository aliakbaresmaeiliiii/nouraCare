<section id="how" class="how" aria-labelledby="how-title">
  <div class="how__inner">
    <header class="how__header">
      <p class="how__eyebrow">{{ 'landing.how.eyebrow' | translate }}</p>
      <h2 id="how-title">{{ 'landing.how.title' | translate }}</h2>
      <p class="how__lede">{{ 'landing.how.lede' | translate }}</p>
    </header>

    <ol class="how__grid">
      @for (n of steps; track n) {
        <li class="how__item">
          <span class="how__num" aria-hidden="true">{{ n }}</span>
          <h3>{{ titleKey(n) | translate }}</h3>
          <p>{{ bodyKey(n) | translate }}</p>
        </li>
      }
    </ol>
  </div>
</section>
