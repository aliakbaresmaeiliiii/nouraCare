<section id="cta" class="cta" aria-labelledby="cta-title">
  <div class="cta__inner">
    <img
      class="cta__logo"
      src="assets/branding/logo.png"
      [attr.alt]="'landing.brandAlt' | translate"
      width="56"
      height="56"
      decoding="async"
    />
    <h2 id="cta-title">{{ 'landing.cta.title' | translate }}</h2>
    <p>{{ 'landing.cta.body' | translate }}</p>
    <div class="cta__actions">
      <a class="cta__primary" routerLink="/app">{{ 'landing.cta.getStarted' | translate }}</a>
      <a class="cta__secondary" routerLink="/app/auth/sign-in">{{
        'landing.cta.hasAccount' | translate
      }}</a>
    </div>
  </div>
</section>
