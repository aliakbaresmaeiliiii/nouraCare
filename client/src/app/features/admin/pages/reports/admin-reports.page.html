<app-admin-stub-page
  title="admin.reports.title"
  panelTitle="admin.reports.exportCenter"
  relatedPath="/admin/analytics"
  relatedLabel="admin.nav.analytics"
>
  <div actions class="admin-page__actions">
    <button type="button" class="admin-btn" (click)="exportCsv()">
      {{ 'admin.common.exportCsv' | translate }}
    </button>
    <button type="button" class="admin-btn" (click)="exportCsv()">
      {{ 'admin.common.exportExcel' | translate }}
    </button>
    <button type="button" class="admin-btn" (click)="pdf()">
      {{ 'admin.common.exportPdf' | translate }}
    </button>
  </div>
</app-admin-stub-page>
