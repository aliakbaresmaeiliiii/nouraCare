<section class="admin-page">
  <header class="admin-page__header">
    <div>
      <h1>{{ 'admin.health.title' | translate }}</h1>
      <p>{{ 'admin.health.subtitle' | translate }}</p>
    </div>
    <button type="button" class="admin-btn" (click)="load()" [disabled]="loading()">
      {{ 'admin.common.retry' | translate }}
    </button>
  </header>

  @if (loading()) {
    <div class="admin-panel health-skeleton" aria-busy="true">
      <app-admin-skeleton height="5rem" />
      <div class="admin-grid-3">
        <app-admin-skeleton height="6rem" />
        <app-admin-skeleton height="6rem" />
        <app-admin-skeleton height="6rem" />
      </div>
    </div>
  } @else if (error()) {
    <div class="admin-panel">
      <p>{{ error()! | translate }}</p>
      <button type="button" class="admin-btn admin-btn--primary" (click)="load()">
        {{ 'admin.common.retry' | translate }}
      </button>
    </div>
  } @else if (health(); as h) {
    <div class="health-banner" [class]="'health-banner--' + h.status">
      <div>
        <strong>{{ systemStatusLabel(h.status) }}</strong>
        <p>{{ lastCheckedLabel(h.checkedAt) }}</p>
      </div>
      <span class="admin-badge" [class]="statusClass(h.status)">
        {{ statusLabel(h.status) }}
      </span>
    </div>

    <div class="admin-grid-3">
      <app-admin-metric-card
        [label]="'admin.health.api' | translate"
        [value]="statusLabel(h.status)"
        [badge]="statusLabel(h.status)"
        [sub]="checkedAtMedium(h.checkedAt)"
      />
      <app-admin-metric-card
        [label]="'admin.health.database' | translate"
        [value]="statusLabel(h.database)"
        [badge]="statusLabel(h.database)"
        [sub]="latencyLabel(h.latencyMs)"
      />
      <app-admin-trend-card
        [label]="'admin.health.uptime' | translate"
        [value]="uptimeLabel()"
        [progress]="uptimeProgress()"
        [caption]="'admin.health.uptimeCaption' | translate"
      />
    </div>
  }
</section>
