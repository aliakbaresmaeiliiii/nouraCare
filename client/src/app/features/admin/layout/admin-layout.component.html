<div
  class="admin-shell"
  [attr.dir]="dir()"
  [attr.lang]="currentLang()"
  [attr.data-theme]="themeSvc.theme()"
  [attr.data-accent]="themeSvc.accent()"
  [class.admin-shell--collapsed]="shell.sidebarCollapsed()"
  [class.admin-shell--boxed]="themeSvc.layout() === 'boxed'"
  [class.admin-shell--compact]="themeSvc.layout() === 'compact'"
>
  <app-admin-sidebar class="admin-shell__sidebar" />

  <div class="admin-shell__main">
    <app-admin-topbar />
    <main class="admin-shell__content">
      <router-outlet />
    </main>
    <app-admin-footer />
  </div>

  @if (shell.mobileNavOpen()) {
    <div class="admin-shell__overlay" (click)="shell.closeMobileNav()" aria-hidden="true"></div>
    <div
      class="admin-shell__drawer"
      role="dialog"
      [attr.aria-label]="'admin.sidebar.nav' | translate"
    >
      <app-admin-sidebar [mobile]="true" (closed)="shell.closeMobileNav()" />
    </div>
  }

  <app-admin-theme-panel />
  <app-admin-toast-host />
</div>
