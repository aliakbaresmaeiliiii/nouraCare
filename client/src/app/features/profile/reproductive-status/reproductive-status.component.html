<div class="reproductive-status-container">
  <div class="header">
    <h1 class="title">{{ 'reproductiveStatusPicker.title' | translate }}</h1>
    <p class="subtitle">{{ 'reproductiveStatusPicker.subtitle' | translate }}</p>
  </div>

  <div class="options-grid">
    @for (option of statusOptions; track option.id) {
    <div
      class="option-card"
      [class.selected]="selectedStatus() === option.id"
      (click)="selectStatus(option.id)"
    >
      <div class="option-icon">{{ option.icon }}</div>
      <div class="option-content">
        <h3 class="option-label">{{ option.labelKey | translate }}</h3>
        <p class="option-description">{{ option.descriptionKey | translate }}</p>
      </div>
    </div>
    }
  </div>
</div>
