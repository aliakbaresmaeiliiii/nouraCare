<ion-content class="tab-page-content tools-hub" [fullscreen]="false">
  <div class="tools-hub-hero">
    <div class="tools-hub-hero__icon">
      <ion-icon name="construct-outline"></ion-icon>
    </div>
    <h1 class="tools-hub-hero__title">{{ 'toolsMenu.heroTitle' | translate }}</h1>
    <p class="tools-hub-hero__subtitle">{{ 'toolsMenu.heroSubtitle' | translate }}</p>
  </div>

  <div class="tools-hub-search">
    <ion-searchbar
      [(ngModel)]="searchQuery"
      [placeholder]="'toolsMenu.search' | translate"
      debounce="200"
      mode="ios"
    ></ion-searchbar>
  </div>

  <div class="tools-hub-body">
    @for (category of visibleCategories(); track category.id) {
      <section class="tools-category">
        <button
          type="button"
          class="tools-category__head"
          (click)="toggleCategory(category.id)"
          [attr.aria-expanded]="isCategoryExpanded(category.id)"
        >
          <div class="tools-category__icon">
            <ion-icon [name]="category.icon"></ion-icon>
          </div>
          <div class="tools-category__text">
            <h2>{{ category.titleKey | translate }}</h2>
            <p>{{ category.subtitleKey | translate }}</p>
          </div>
          <ion-icon
            class="tools-category__chevron"
            [name]="isCategoryExpanded(category.id) ? 'chevron-up-outline' : 'chevron-down-outline'"
          ></ion-icon>
        </button>

        @if (isCategoryExpanded(category.id)) {
          <div class="tools-grid">
            @for (item of filteredItems(category); track item.id) {
              <button
                type="button"
                class="tools-item"
                (click)="openTool(item)"
                [style.--item-accent]="item.color ?? '#6366f1'"
              >
                <div class="tools-item__icon">
                  <ion-icon [name]="item.icon"></ion-icon>
                </div>
                <div class="tools-item__body">
                  <h3>{{ item.titleKey | translate }}</h3>
                  <p>{{ item.descKey | translate }}</p>
                </div>
                <ion-icon name="chevron-forward-outline" class="tools-item__arrow"></ion-icon>
              </button>
            }
          </div>
        }
      </section>
    } @empty {
      <div class="tools-empty">
        <ion-icon name="search-outline"></ion-icon>
        <p>{{ 'toolsMenu.noResults' | translate }}</p>
      </div>
    }
  </div>
</ion-content>
