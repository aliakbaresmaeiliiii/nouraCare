<ion-content class="tpi5-content" [fullscreen]="true" scrollY="false">
  <div class="tpi5-root">
    <ion-progress-bar [value]="progressValue"></ion-progress-bar>
    <main class="tpi5-main">
      <div class="tpi5-figure" aria-hidden="true">
        <div class="tpi5-figure-ring">
          <img class="tpi5-hero-img" [src]="heroImageSrc" alt="" />
        </div>
      </div>

      <h1 class="tpi5-title">
        Your body goes through changes because it's building a baby from scratch!
      </h1>

      <p class="tpi5-body">
        We're here to help support you and embrace your body and its achievements - you're doing
        some pretty amazing things right now.
      </p>
    </main>

    <footer class="tpi5-footer">
      <app-button (buttonClick)="continueNext()">Continue</app-button>
    </footer>
  </div>
</ion-content>
