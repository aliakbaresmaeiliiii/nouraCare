<ion-header class="sub-settings-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ 'settings.help.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="sub-settings-content">
  <p class="lede">{{ 'settings.help.body' | translate }}</p>

  <ion-button expand="block" (click)="openContactOptions()">
    <ion-icon name="mail-outline" slot="start"></ion-icon>
    {{ 'menu.contactUs' | translate }}
  </ion-button>

  <ion-button expand="block" fill="outline" (click)="openFeedback()">
    <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
    {{ 'settings.feedback.title' | translate }}
  </ion-button>

  <ion-button expand="block" fill="clear" [routerLink]="['/check-version']">
    <ion-icon name="refresh-outline" slot="start"></ion-icon>
    {{ 'menu.checkUpdates' | translate }}
  </ion-button>
</ion-content>
