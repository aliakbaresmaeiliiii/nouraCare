<ion-content class="tpi7-content" [fullscreen]="true" scrollY="false">
  <div class="tpi7-root">
    <main class="tpi7-main">
      <h1 class="tpi7-title">Your personal pregnancy program</h1>

      <div class="tpi7-list" role="list">
        @for (benefit of benefits; track benefit.text) {
          <div class="tpi7-item" role="listitem">
            <span class="tpi7-icon-wrap" aria-hidden="true">{{ benefit.icon }}</span>
            <span class="tpi7-text">{{ benefit.text }}</span>
          </div>
        }
      </div>
    </main>

    <footer class="tpi7-footer">
      <ion-button class="tpi7-next" shape="round" (click)="continueNext()">Next</ion-button>
    </footer>
  </div>
</ion-content>
