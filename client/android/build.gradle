// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Mirrors first: dl.google.com is often unreachable (firewall / regional blocks).
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

subprojects { sub ->
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin('com.android.application') || sub.plugins.hasPlugin('com.android.library')) {
            sub.android.buildToolsVersion rootProject.ext.buildToolsVersion
            if (sub.android.hasProperty('compileSdkMinor') && rootProject.ext.has('compileSdkMinorVersion')) {
                sub.android.compileSdkMinor rootProject.ext.compileSdkMinorVersion
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
