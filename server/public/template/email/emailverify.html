<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{HEADLINE}}</title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        border: 0;
        outline: none;
        text-decoration: none;
      }
      @media only screen and (max-width: 620px) {
        .email-shell {
          width: 100% !important;
        }
        .email-body {
          padding: 28px 20px !important;
        }
        .code-box {
          font-size: 32px !important;
          letter-spacing: 0.28em !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #eef2ff;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      color: #1e1b4b;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
      "
    >
      {{PREHEADER}}
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #eef2ff; padding: 32px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            class="email-shell"
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border-radius: 24px;
              overflow: hidden;
              box-shadow: 0 18px 48px rgba(79, 70, 229, 0.12);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #6366f1 0%, #4f46e5 52%, #7c3aed 100%);
                  padding: 36px 32px 32px;
                  text-align: {{TEXT_ALIGN}};
                "
              >
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="padding-bottom: 18px">
                      <span
                        style="
                          display: inline-block;
                          padding: 8px 14px;
                          border-radius: 999px;
                          background: rgba(255, 255, 255, 0.16);
                          color: #ffffff;
                          font-size: 12px;
                          font-weight: 700;
                          letter-spacing: 0.04em;
                          text-transform: uppercase;
                        "
                      >
                        {{BADGE}}
                      </span>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div
                        style="
                          color: #ffffff;
                          font-size: 28px;
                          line-height: 1.25;
                          font-weight: 800;
                          margin: 0 0 8px;
                        "
                      >
                        {{APP_NAME}}
                      </div>
                      <div
                        style="
                          color: rgba(255, 255, 255, 0.92);
                          font-size: 18px;
                          line-height: 1.5;
                          font-weight: 500;
                          margin: 0;
                        "
                      >
                        {{HEADLINE}}
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td
                class="email-body"
                style="padding: 36px 40px 12px; text-align: {{TEXT_ALIGN}}"
              >
                <p
                  style="
                    margin: 0 0 12px;
                    font-size: 18px;
                    line-height: 1.6;
                    color: #312e81;
                    font-weight: 600;
                  "
                >
                  {{GREETING}}
                </p>
                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 16px;
                    line-height: 1.75;
                    color: #4338ca;
                  "
                >
                  {{BODY}}
                </p>

                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin-bottom: 18px"
                >
                  <tr>
                    <td align="center">
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        style="
                          width: 100%;
                          max-width: 420px;
                          background: #f5f3ff;
                          border: 1px solid #ddd6fe;
                          border-radius: 20px;
                        "
                      >
                        <tr>
                          <td style="padding: 24px 20px; text-align: center">
                            <div
                              style="
                                font-size: 13px;
                                line-height: 1.4;
                                color: #6366f1;
                                font-weight: 700;
                                margin-bottom: 12px;
                                letter-spacing: 0.02em;
                              "
                            >
                              {{CODE_LABEL}}
                            </div>
                            <div
                              class="code-box"
                              style="
                                display: inline-block;
                                font-size: 38px;
                                line-height: 1.2;
                                font-weight: 800;
                                letter-spacing: 0.34em;
                                color: #312e81;
                                font-family: 'Courier New', Courier, monospace;
                                padding: 4px 8px 4px 16px;
                              "
                            >
                              {{TOKEN}}
                            </div>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 0 0 28px;
                    font-size: 14px;
                    line-height: 1.7;
                    color: #64748b;
                  "
                >
                  {{EXPIRY}}
                </p>

                <p
                  style="
                    margin: 0;
                    font-size: 15px;
                    line-height: 1.6;
                    color: #4338ca;
                  "
                >
                  {{CLOSING}}<br />
                  <strong style="color: #312e81">{{TEAM_NAME}}</strong>
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 24px 40px 32px;
                  background: #fafafa;
                  border-top: 1px solid #ede9fe;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0 0 10px;
                    font-size: 13px;
                    line-height: 1.6;
                    color: #64748b;
                  "
                >
                  {{FOOTER_NOTE}}
                </p>
                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 1.5;
                    color: #94a3b8;
                  "
                >
                  {{COPYRIGHT}}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
